mod_license=GNU Lesser General Public License v2.1
mod_version=1.0.0-alpha.03
mod_group_id=org.bitwisemadness.journeyman
mod_authors=Bitwise Madness
mod_description=The pack's professions engine: 18 datapack-tunable professions - ten trades and eight masteries - levelling on the RuneScape XP curve to level 99, all progressing concurrently with no job slots. A profession's level is its own gate: training it unlocks the next tier of what it controls. Every activity resolves at one interception point - check the gate, apply the bonus, grant the XP - attributed to the player who performed it. Gates never gate combat against mobs; they gate equipment, crafting, and world/creature interactions.

